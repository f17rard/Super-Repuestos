name: CI - Integridad de Super-Repuestos

# Flujo: feature (rama propia) -> PR a qa -> pruebas QA -> PR a main.
on:
  push:
    branches: [qa, main]
  pull_request:
    branches: [qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Credenciales ficticias: las pruebas NO tocan Supabase (se usa una BD simulada).
  SUPABASE_URL: http://127.0.0.1:9
  SUPABASE_KEY: ci-dummy-key

jobs:
  # A main solo se llega desde qa
  flujo:
    name: Flujo de ramas (main solo desde qa)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Verificar rama de origen
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          [ "$ORIGEN" = "qa" ] || { echo "Un PR hacia main solo se acepta desde qa (origen: $ORIGEN)."; exit 1; }

  # Lint + pruebas + humo en un solo job: una instalación, un runner.
  verificar:
    name: Verificar (lint, pruebas, humo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint y sintaxis
        run: |
          ruff check .
          python -m compileall -q backend controlDeErrores.py tests
          node --check frontend/js/app.js

      - name: Pruebas con cobertura
        run: pytest --cov --cov-report=term-missing

      - name: "Humo: main.py vive en backend/, por eso --app-dir"
        run: |
          uvicorn main:app --app-dir backend --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/openapi.json > openapi.json && break
            sleep 1
          done
          test -s openapi.json
          curl -sf http://127.0.0.1:8000/ | grep -q "Buscador de repuestos"
          for ruta in /api/marcas /api/modelos /api/anios /api/repuestos; do
            grep -q "\"$ruta\"" openapi.json || { echo "Falta $ruta"; exit 1; }
          done
          code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:8000/api/marcas)
          test "$code" = "503" && grep -q BD_NO_DISPONIBLE body.json

  # Seguridad en paralelo (independiente de lo anterior)
  seguridad:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Auditar dependencias y .env versionados
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Hay un archivo .env versionado" && exit 1
          fi

  # Paso 5: pruebas manuales. Requiere "Required reviewers" en el entorno qa-manual.
  qa-manual:
    name: Pruebas manuales QA aprobadas
    runs-on: ubuntu-latest
    needs: [verificar, seguridad]
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    environment: qa-manual
    steps:
      - run: echo "Pruebas automáticas OK y pruebas manuales aprobadas en qa (${GITHUB_SHA})."
